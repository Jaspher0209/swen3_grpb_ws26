services:
  backend:
    build: ./PaperlessREST/
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=ppls;Username=ppls;Password=ppls
      - ASPNETCORE_URLS=http://+:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ppls
      POSTGRES_USER: ppls
      POSTGRES_PASSWORD: ppls
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ppls -d ppls" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
    postgres_data: